packages:
  - 'shell'
  - 'storybook'
  - 'libs/*'
  - 'apps/*'
  - 'local/*'
overrides:
  react: 19.2.8
  react-dom: 19.2.8
allowBuilds:
  '@enzedonline/quill-blot-formatter2': false
  '@parcel/watcher': true
  canvas: false
  core-js: false
  esbuild: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@symbion/runtype@1.3.1'
  - '@symbion/opalui@0.16.0'
