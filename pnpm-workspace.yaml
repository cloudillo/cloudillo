packages:
    - "shell"
    - "storybook"
    - "libs/*"
    - "apps/*"
    - "local/*"
overrides:
    react: 19.3.1
    react-dom: 19.3.1
    yjs: 13.6.33
    y-protocols: 1.0.7
    y-websocket: 3.1.0
    y-indexeddb: 9.0.12
allowBuilds:
    "@enzedonline/quill-blot-formatter2": false
    "@parcel/watcher": true
    canvas: false
    core-js: false
    esbuild: false
    unrs-resolver: false
minimumReleaseAgeExclude:
    - "@symbion/opalui@0.16.2"
